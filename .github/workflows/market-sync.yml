name: Stock Market Sync

# Schedule: 9:20 AM IST (3:50 AM UTC) and 3:35 PM IST (10:05 AM UTC)
# IST = UTC + 5:30
on:
  schedule:
    # 9:20 AM IST = 3:50 AM UTC
    - cron: '50 3 * * 1-5'  # Monday-Friday at 3:50 AM UTC
    # 3:35 PM IST = 10:05 AM UTC
    - cron: '5 10 * * 1-5'  # Monday-Friday at 10:05 AM UTC
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      session:
        description: 'Market session (OPEN or CLOSE)'
        required: false
        type: choice
        options:
          - AUTO
          - OPEN
          - CLOSE

jobs:
  sync-market-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Market Sync
        run: |
          # Determine session if manual trigger
          SESSION_PARAM=""
          if [ "${{ github.event.inputs.session }}" != "" ] && [ "${{ github.event.inputs.session }}" != "AUTO" ]; then
            SESSION_PARAM="{\"session\": \"${{ github.event.inputs.session }}\"}"
          else
            SESSION_PARAM="{}"
          fi
          
          # Call Next.js API endpoint
          RESPONSE=$(curl -X POST \
            -H "Content-Type: application/json" \
            -d "$SESSION_PARAM" \
            -w "\n%{http_code}" \
            ${{ secrets.APP_URL }}/api/portfolio/market-sync)
          
          # Extract status code and body
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          # Check if successful
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Market sync successful"
            exit 0
          else
            echo "❌ Market sync failed"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "Market sync failed. Check logs for details."
          # You can add notification logic here (Slack, Discord, email, etc.)
